name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: lorem_ipsum
          POSTGRES_PASSWORD: password
          POSTGRES_DB: express_todo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lorem_ipsum"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Apply schema
        run: PGPASSWORD=password psql -h localhost -U lorem_ipsum -d express_todo_test -f scripts/init.sql

      - run: npm test