/auth/sign-up:
  post:
    summary: Register a new user
    tags:
      - auth
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SignUpRequest'
    responses:
      201:
        description: User registered successfully.
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                user:
                  $ref: '#/components/schemas/User'
      400:
        $ref: '#/components/responses/BadRequest'
      409:
        $ref: '#/components/responses/Conflict'

/auth/login:
  post:
    summary: Log in a user
    tags:
      - auth
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: ["username", "password"]
            properties:
              username:
                type: string
              password:
                type: string
    responses:
      200:
        description: User logged in successfully.
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                refreshToken:
                  type: string
      400:
        $ref: '#/components/responses/BadRequest'
      401:
        description: Invalid username or password.
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string

/auth/refresh:
  post:
    summary: Refresh the access token
    tags:
      - auth
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: ["refreshToken"]
            properties:
              refreshToken:
                type: string
    responses:
      200:
        description: Access token refreshed successfully.
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
      400:
        $ref: '#/components/responses/BadRequest'
      401:
        description: Invalid refresh token.
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string

/auth/verify:
  get:
    summary: Verify the access token
    tags:
      - auth
    security:
      - bearerAuth: []
    responses:
      200:
        description: Access token is valid.
        content:
          application/json:
            schema:
              type: object
              properties:
                valid:
                  type: boolean
                data:
                  type: object
      401:
        description: Invalid or missing access token.
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string